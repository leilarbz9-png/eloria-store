<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ÉLORIA — Women's Fashion</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #FAF8F3;
    color: #242222;
    font-family: 'Montserrat', sans-serif;
}

/* ================= TOP BAR ================= */

.top-bar {
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #242222;
    color: #FAF8F3;
    font-size: 10px;
    letter-spacing: 1.5px;
}

/* ================= NAVBAR ================= */

.navbar {
    height: 82px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 5%;
    background: #FAF8F3;
    border-bottom: 1px solid rgba(36,34,34,0.08);
}

.logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 38px;
    letter-spacing: 5px;
    font-weight: 500;
}

.nav-links {
    display: flex;
    gap: 30px;
    list-style: none;
}

.nav-links a {
    text-decoration: none;
    color: #242222;
    font-size: 11px;
    letter-spacing: 1.5px;
    transition: 0.3s;
}

.nav-links a:hover {
    color: #C9A96E;
}

.nav-icons {
    display: flex;
    gap: 18px;
    font-size: 20px;
}

.nav-icons span {
    cursor: pointer;
    transition: 0.3s;
}

.nav-icons span:hover {
    color: #C9A96E;
}

.mobile-menu {
    display: none;
}

/* ================= HERO ================= */

.hero {
    min-height: calc(100vh - 116px);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;

    background:
        linear-gradient(
            rgba(20,20,20,0.15),
            rgba(20,20,20,0.25)
        ),
        url('https://images.unsplash.com/photo-1539109136881-3be0616acf4b?auto=format&fit=crop&w=1800&q=85');

    background-size: cover;
    background-position: center;
}

.hero-content {
    text-align: center;
    color: white;
    animation: fadeUp 1.2s ease forwards;
}

.small-title {
    font-size: 12px;
    letter-spacing: 4px;
    margin-bottom: 18px;
}

.hero h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(55px, 8vw, 110px);
    font-weight: 400;
    letter-spacing: 3px;
    margin-bottom: 10px;
}

.hero p {
    font-size: 13px;
    letter-spacing: 3px;
    margin-bottom: 35px;
}

.shop-button {
    display: inline-block;
    padding: 15px 38px;
    background: #FAF8F3;
    color: #242222;
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 2px;
    transition: 0.4s;
}

.shop-button:hover {
    background: #C9A96E;
    color: white;
}

/* ================= NEW ARRIVALS ================= */

.new-arrivals {
    padding: 90px 5%;
    background: #FAF8F3;
}

.section-header {
    text-align: center;
    margin-bottom: 45px;
}

.section-subtitle {
    font-size: 10px;
    letter-spacing: 4px;
    color: #77716D;
    margin-bottom: 12px;
}

.section-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 48px;
    font-weight: 500;
    letter-spacing: 2px;
}

.products {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
}

/* ================= PRODUCT ================= */

.product {
    position: relative;
    overflow: hidden;
    background: #EDE5DA;
}

.product-gallery {
    position: relative;
    width: 100%;
    height: 480px;
    overflow: hidden;
    touch-action: pan-y;
    cursor: grab;
}

.product-track {
    display: flex;
    width: 200%;
    height: 100%;
    transition: transform 0.45s ease;
}

.product-slide {
    width: 50%;
    height: 100%;
    flex: 0 0 50%;
}

.product-slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* ================= DOTS ================= */

.carousel-dots {
    position: absolute;
    z-index: 4;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 7px;
}

.carousel-dot {
    width: 7px;
    height: 7px;
    padding: 0;
    border-radius: 50%;
    background: rgba(255,255,255,0.55);
    border: 1px solid rgba(0,0,0,0.15);
    cursor: pointer;
}

.carousel-dot.active {
    background: white;
}

/* ================= PRODUCT INFO ================= */

.product-info {
    padding: 18px 5px 12px;
}

.product-name {
    font-size: 12px;
    letter-spacing: 1px;
    margin-bottom: 8px;
}

.product-price {
    font-size: 11px;
    color: #77716D;
}

.old-price {
    text-decoration: line-through;
    color: #999;
    margin-right: 7px;
}

.sale-price {
    color: #242222;
}

.product-tag {
    position: absolute;
    top: 15px;
    left: 15px;
    background: #FAF8F3;
    padding: 8px 12px;
    font-size: 9px;
    letter-spacing: 1.5px;
    z-index: 5;
}

/* ================= MESSAGES ================= */

.loading,
.no-products {
    grid-column: 1 / -1;
    text-align: center;
    padding: 50px 10px;
    color: #77716D;
    font-size: 11px;
    letter-spacing: 2px;
}

/* ================= CATEGORIES ================= */

.categories {
    padding: 90px 5%;
    background: #EDE5DA;
}

.category-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
}

.category-card {
    position: relative;
    height: 500px;
    overflow: hidden;
    text-decoration: none;
    background: #FAF8F3;
}

.category-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.7s ease;
}

.category-card:hover img {
    transform: scale(1.05);
}

.category-card::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(20,20,20,0.18);
    transition: 0.4s;
}

.category-card:hover::after {
    background: rgba(20,20,20,0.28);
}

.category-card span {
    position: absolute;
    z-index: 2;
    left: 50%;
    bottom: 30px;
    transform: translateX(-50%);
    color: white;
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    letter-spacing: 3px;
    white-space: nowrap;
}

/* ================= ANIMATION ================= */

@keyframes fadeUp {

    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

/* ================= MOBILE ================= */

@media (max-width: 768px) {

    .top-bar {
        font-size: 8px;
        letter-spacing: 1px;
    }

    .navbar {
        height: 70px;
        padding: 0 20px;
    }

    .logo {
        font-size: 30px;
        letter-spacing: 3px;
    }

    .nav-links {
        display: none;
    }

    .nav-icons {
        gap: 12px;
        font-size: 18px;
    }

    .mobile-menu {
        display: block;
        font-size: 21px;
        cursor: pointer;
    }

    .hero {
        min-height: calc(100vh - 104px);
        background-position: center;
    }

    .hero h1 {
        font-size: 58px;
    }

    .hero p {
        font-size: 10px;
        letter-spacing: 2px;
        padding: 0 20px;
    }

    .small-title {
        font-size: 9px;
        letter-spacing: 3px;
    }

    .shop-button {
        padding: 14px 30px;
    }

    .new-arrivals {
        padding: 65px 15px;
    }

    .section-header {
        margin-bottom: 30px;
    }

    .section-subtitle {
        font-size: 8px;
        letter-spacing: 3px;
    }

    .section-title {
        font-size: 38px;
    }

    .products {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }

    .product-gallery {
        height: 280px;
    }

    .product-info {
        padding: 12px 3px 8px;
    }

    .product-name {
        font-size: 10px;
    }

    .product-price {
        font-size: 9px;
    }

    .product-tag {
        top: 10px;
        left: 10px;
        padding: 6px 8px;
        font-size: 7px;
    }

    .categories {
        padding: 65px 15px;
    }

    .category-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }

    .category-card {
        height: 300px;
    }

    .category-card span {
        font-size: 21px;
        bottom: 20px;
        letter-spacing: 2px;
    }

}

</style>

</head>

<body>

<div class="top-bar">
    FREE SHIPPING ON ORDERS OVER €100
</div>

<header class="navbar">

    <div class="mobile-menu">
        ☰
    </div>

    <div class="logo">
        ÉLORIA
    </div>

    <nav>

        <ul class="nav-links">

            <li><a href="#new-arrivals">NEW IN</a></li>
            <li><a href="#new-arrivals">COLLECTION</a></li>
            <li><a href="#categories">DRESSES</a></li>
            <li><a href="#categories">TOPS</a></li>
            <li><a href="#categories">BOTTOMS</a></li>
            <li><a href="#new-arrivals">SALE</a></li>

        </ul>

    </nav>

    <div class="nav-icons">
        <span>⌕</span>
        <span>♡</span>
        <span>🛍</span>
    </div>

</header>

<section class="hero">

    <div class="hero-content">

        <div class="small-title">
            THE ART OF ELEGANCE
        </div>

        <h1>
            A NEW CHAPTER
        </h1>

        <p>
            DISCOVER THE NEW COLLECTION
        </p>

        <a href="#new-arrivals" class="shop-button">
            SHOP NOW
        </a>

    </div>

</section>

<section class="new-arrivals" id="new-arrivals">

    <div class="section-header">

        <div class="section-subtitle">
            JUST ARRIVED
        </div>

        <h2 class="section-title">
            New Arrivals
        </h2>

    </div>

    <div class="products" id="products">

        <div class="loading">
            LOADING PRODUCTS...
        </div>

    </div>

</section>

<section class="categories" id="categories">

    <div class="section-header">

        <div class="section-subtitle">
            EXPLORE
        </div>

        <h2 class="section-title">
            Shop by Category
        </h2>

    </div>

    <div class="category-grid">

        <a href="#new-arrivals" class="category-card">

            <img
                src="https://images.unsplash.com/photo-1515372039744-b8f02a3ae446?auto=format&fit=crop&w=900&q=85"
                alt="Dresses">

            <span>DRESSES</span>

        </a>

        <a href="#new-arrivals" class="category-card">

            <img
                src="https://images.unsplash.com/photo-1485968579580-b6d095142e6e?auto=format&fit=crop&w=900&q=85"
                alt="Tops">

            <span>TOPS</span>

        </a>

        <a href="#new-arrivals" class="category-card">

            <img
                src="https://images.unsplash.com/photo-1506629905607-d9c297d3b7b7?auto=format&fit=crop&w=900&q=85"
                alt="Bottoms">

            <span>BOTTOMS</span>

        </a>

        <a href="#new-arrivals" class="category-card">

            <img
                src="https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=900&q=85"
                alt="Accessories">

            <span>ACCESSORIES</span>

        </a>

    </div>

</section>

<script>

/* =========================================================
   GOOGLE APPS SCRIPT URL
   ========================================================= */

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzAYBy46FwQm_znbR7wzPb9rtzj6phhQXDJPTNX3dCDDc0kysevoo9ksiQEgjBqpi2Qjw/exec";


/* =========================================================
   LOAD PRODUCTS
   ========================================================= */

function loadProducts() {

    const container =
        document.getElementById("products");

    if (!container) {
        console.error("Products container not found.");
        return;
    }

    container.innerHTML = `
        <div class="loading">
            LOADING PRODUCTS...
        </div>
    `;


    /* =====================================================
       TRY FETCH FIRST
       ===================================================== */

    fetch(
        SCRIPT_URL + "?t=" + Date.now(),
        {
            method: "GET",
            cache: "no-store"
        }
    )

    .then(function(response) {

        if (!response.ok) {
            throw new Error(
                "HTTP ERROR " + response.status
            );
        }

        return response.json();

    })

    .then(function(data) {

        console.log(
            "FETCH SUCCESS:",
            data
        );

        displayProducts(data);

    })

    .catch(function(error) {

        console.warn(
            "FETCH FAILED. TRYING JSONP...",
            error
        );

        loadProductsJSONP();

    });

}


/* =========================================================
   JSONP FALLBACK
   ========================================================= */

function loadProductsJSONP() {

    const container =
        document.getElementById("products");


    const callbackName =
        "eloria_callback_" +
        Date.now() +
        "_" +
        Math.floor(
            Math.random() * 100000
        );


    const script =
        document.createElement("script");


    let finished = false;


    function cleanup() {

        if (script.parentNode) {
            script.parentNode.removeChild(script);
        }

        delete window[callbackName];

    }


    window[callbackName] =
        function(data) {

            if (finished) {
                return;
            }

            finished = true;


            console.log(
                "JSONP SUCCESS:",
                data
            );


            try {

                displayProducts(data);

            }

            catch (error) {

                console.error(
                    "PRODUCT DISPLAY ERROR:",
                    error
                );

                container.innerHTML = `
                    <div class="no-products">
                        PRODUCTS COULD NOT BE DISPLAYED
                    </div>
                `;

            }


            cleanup();

        };


    script.src =
        SCRIPT_URL +
        "?callback=" +
        encodeURIComponent(callbackName) +
        "&t=" +
        Date.now();


    console.log(
        "JSONP URL:",
        script.src
    );


    script.onerror =
        function() {

            if (finished) {
                return;
            }

            finished = true;


            container.innerHTML = `
                <div class="no-products">
                    PRODUCTS COULD NOT BE LOADED
                </div>
            `;


            cleanup();

        };


    document.body.appendChild(script);


    setTimeout(
        function() {

            if (finished) {
                return;
            }

            finished = true;


            container.innerHTML = `
                <div class="no-products">
                    CONNECTION TIMEOUT
                </div>
            `;


            cleanup();

        },
        15000
    );

}


/* =========================================================
   DISPLAY PRODUCTS
   ========================================================= */

function displayProducts(products) {

    const container =
        document.getElementById("products");


    container.innerHTML = "";


    if (
        !Array.isArray(products) ||
        products.length === 0
    ) {

        container.innerHTML = `
            <div class="no-products">
                NO PRODUCTS AVAILABLE
            </div>
        `;

        return;
    }


    /* =====================================================
       AVAILABLE PRODUCTS
       ===================================================== */

    const availableProducts =
        products.filter(
            function(product) {

                return String(
                    product.Status ||
                    product.status ||
                    ""
                )
                .trim()
                .toLowerCase() ===
                "available";

            }
        );


    if (availableProducts.length === 0) {

        container.innerHTML = `
            <div class="no-products">
                NO PRODUCTS AVAILABLE
            </div>
        `;

        return;
    }


    /* =====================================================
       NEW PRODUCTS FIRST
       ===================================================== */

    availableProducts.sort(
        function(a, b) {

            const aNew =
                a.New === true ||
                String(a.New)
                    .toLowerCase() ===
                    "true" ||
                a.NEW === true;


            const bNew =
                b.New === true ||
                String(b.New)
                    .toLowerCase() ===
                    "true" ||
                b.NEW === true;


            return (
                Number(bNew) -
                Number(aNew)
            );

        }
    );


    /* =====================================================
       CREATE PRODUCT CARDS
       ===================================================== */

    availableProducts.forEach(
        function(product) {

            createProduct(
                product,
                container
            );

        }
    );


    initializeGalleries();

}


/* =========================================================
   CREATE PRODUCT
   ========================================================= */

function createProduct(
    product,
    container
) {

    const name =
        product["Product Name"] ||
        "PRODUCT";


    const price =
        product["Price"] ||
        "";


    const oldPrice =
        product["Old Price"] ||
        "";


    const image1 =
        product["Image 1"] ||
        "";


    const image2 =
        product["Image 2"] ||
        "";


    const isNew =
        product["New"] === true ||
        String(product["New"])
            .toLowerCase() ===
            "true";


    const isSale =
        product["Sale"] === true ||
        String(product["Sale"])
            .toLowerCase() ===
            "true";


    /* =====================================================
       IMAGES
       ===================================================== */

    let firstImage =
        image1 || image2;


    let secondImage =
        image2 || image1;


    if (!firstImage) {

        firstImage =
            "https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=900&q=85";

        secondImage =
            firstImage;

    }


    if (!secondImage) {
        secondImage =
            firstImage;
    }


    /* =====================================================
       TAG
       ===================================================== */

    let tag = "";


    if (isSale) {

        tag = "SALE";

    } else if (isNew) {

        tag = "NEW";

    }


    /* =====================================================
       PRICE
       ===================================================== */

    const numericPrice =
        Number(price);


    const numericOldPrice =
        Number(oldPrice);


    let priceHTML = "";


    if (
        isSale &&
        oldPrice !== "" &&
        !isNaN(numericOldPrice)
    ) {

        priceHTML = `

            <span class="old-price">
                €${numericOldPrice.toFixed(2)}
            </span>

            <span class="sale-price">
                €${numericPrice.toFixed(2)}
            </span>

        `;

    } else {

        priceHTML = `
            €${numericPrice.toFixed(2)}
        `;

    }


    /* =====================================================
       PRODUCT ELEMENT
       ===================================================== */

    const element =
        document.createElement("div");


    element.className =
        "product";


    element.innerHTML = `

        ${
            tag
                      ? `
                <div class="product-tag">
                    ${tag}
                </div>
            `
            : ""
    }
                tag
            ? `
                <div class="product-tag">
                    ${tag}
                </div>
            `
            : ""
        }

        <div
            class="product-gallery"
            data-gallery
        >

            <div class="product-track">

                <div class="product-slide">

                    <img
                        src="${escapeHTML(firstImage)}"
                        alt="${escapeHTML(name)}"
                        loading="lazy"
                    >

                </div>

                <div class="product-slide">

                    <img
                        src="${escapeHTML(secondImage)}"
                        alt="${escapeHTML(name)} second view"
                        loading="lazy"
                    >

                </div>

            </div>

            <div class="carousel-dots">

                <button
                    class="carousel-dot active"
                    type="button"
                    aria-label="Image 1">
                </button>

                <button
                    class="carousel-dot"
                    type="button"
                    aria-label="Image 2">
                </button>

            </div>

        </div>

        <div class="product-info">

            <div class="product-name">
                ${escapeHTML(name).toUpperCase()}
            </div>

            <div class="product-price">
                ${priceHTML}
            </div>

        </div>

    `;


    container.appendChild(element);

}


/* =========================================================
   SECURITY
   ========================================================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   PRODUCT IMAGE CAROUSELS
   ========================================================= */

function initializeGalleries() {

    document
        .querySelectorAll("[data-gallery]")
        .forEach(function(gallery) {

            const track =
                gallery.querySelector(".product-track");

            const dots =
                gallery.querySelectorAll(".carousel-dot");

            let current = 0;


            function showImage(index) {

                current =
                    Math.max(
                        0,
                        Math.min(1, index)
                    );


                track.style.transform =
                    "translateX(-" +
                    (current * 50) +
                    "%)";


                dots.forEach(function(dot, i) {

                    if (i === current) {

                        dot.classList.add("active");

                    } else {

                        dot.classList.remove("active");

                    }

                });

            }


            dots.forEach(function(dot, index) {

                dot.addEventListener(
                    "click",
                    function() {

                        showImage(index);

                    }
                );

            });


            /* SWIPE ON PHONE */

            let startX = 0;
            let endX = 0;


            gallery.addEventListener(
                "touchstart",
                function(event) {

                    startX =
                        event.touches[0].clientX;

                },
                { passive: true }
            );


            gallery.addEventListener(
                "touchend",
                function(event) {

                    endX =
                        event.changedTouches[0].clientX;

                    const difference =
                        startX - endX;


                    if (Math.abs(difference) < 40) {
                        return;
                    }


                    if (difference > 0) {

                        showImage(current + 1);

                    } else {

                        showImage(current - 1);

                    }

                },
                { passive: true }
            );


            showImage(0);

        });

}


/* =========================================================
   START WEBSITE
   ========================================================= */

loadProducts();

</script>

</body>
</html>
