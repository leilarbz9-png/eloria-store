<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ÉLORIA — Women's Fashion</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #FAF8F3;
    color: #242222;
    font-family: 'Montserrat', sans-serif;
}

/* TOP BAR */

.top-bar {
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #242222;
    color: #FAF8F3;
    font-size: 10px;
    letter-spacing: 1.5px;
}

/* NAVBAR */

.navbar {
    height: 82px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 5%;
    background: #FAF8F3;
    border-bottom: 1px solid rgba(36,34,34,0.08);
}

.logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 38px;
    letter-spacing: 5px;
    font-weight: 500;
}

.nav-links {
    display: flex;
    gap: 30px;
    list-style: none;
}

.nav-links a {
    text-decoration: none;
    color: #242222;
    font-size: 11px;
    letter-spacing: 1.5px;
    transition: 0.3s;
}

.nav-links a:hover {
    color: #C9A96E;
}

.nav-icons {
    display: flex;
    gap: 18px;
    font-size: 20px;
}

.nav-icons span {
    cursor: pointer;
    transition: 0.3s;
}

.nav-icons span:hover {
    color: #C9A96E;
}

/* HERO */

.hero {
    min-height: calc(100vh - 116px);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;

    background:
        linear-gradient(
            rgba(20,20,20,0.15),
            rgba(20,20,20,0.25)
        ),
        url('https://images.unsplash.com/photo-1539109136881-3be0616acf4b?auto=format&fit=crop&w=1800&q=85');

    background-size: cover;
    background-position: center;
}

.hero-content {
    text-align: center;
    color: white;
    animation: fadeUp 1.2s ease forwards;
}

.small-title {
    font-size: 12px;
    letter-spacing: 4px;
    margin-bottom: 18px;
}

.hero h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(55px, 8vw, 110px);
    font-weight: 400;
    letter-spacing: 3px;
    margin-bottom: 10px;
}

.hero p {
    font-size: 13px;
    letter-spacing: 3px;
    margin-bottom: 35px;
}

.shop-button {
    display: inline-block;
    padding: 15px 38px;
    background: #FAF8F3;
    color: #242222;
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 2px;
    transition: 0.4s;
}

.shop-button:hover {
    background: #C9A96E;
    color: white;
}

/* ANIMATION */

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* MOBILE */

.mobile-menu {
    display: none;
}

@media (max-width: 768px) {

    .top-bar {
        font-size: 8px;
        letter-spacing: 1px;
    }

    .navbar {
        height: 70px;
        padding: 0 20px;
    }

    .logo {
        font-size: 30px;
        letter-spacing: 3px;
    }

    .nav-links {
        display: none;
    }

    .nav-icons {
        gap: 12px;
        font-size: 18px;
    }

    .mobile-menu {
        display: block;
        font-size: 21px;
        cursor: pointer;
    }

    .hero {
        min-height: calc(100vh - 104px);
        background-position: center;
    }

    .hero h1 {
        font-size: 58px;
    }

    .hero p {
        font-size: 10px;
        letter-spacing: 2px;
        padding: 0 20px;
    }

    .small-title {
        font-size: 9px;
        letter-spacing: 3px;
    }

    .shop-button {
        padding: 14px 30px;
    }
}
</style>
</head>

<body>

<!-- TOP BAR -->

<div class="top-bar">
    FREE SHIPPING ON ORDERS OVER €100
</div>

<!-- NAVBAR -->

<header class="navbar">

    <div class="mobile-menu">
        ☰
    </div>

    <div class="logo">
        ÉLORIA
    </div>

    <nav>
        <ul class="nav-links">
            <li><a href="#">NEW IN</a></li>
            <li><a href="#">COLLECTION</a></li>
            <li><a href="#">DRESSES</a></li>
            <li><a href="#">TOPS</a></li>
            <li><a href="#">BOTTOMS</a></li>
            <li><a href="#">SALE</a></li>
        </ul>
    </nav>

    <div class="nav-icons">
        <span>⌕</span>
        <span>♡</span>
        <span>🛍</span>
    </div>

</header>

<!-- HERO -->

<section class="hero">

    <div class="hero-content">

        <div class="small-title">
            THE ART OF ELEGANCE
        </div>

        <h1>
            A NEW CHAPTER
        </h1>

        <p>
            DISCOVER THE NEW COLLECTION
        </p>

        <a href="#" class="shop-button">
            SHOP NOW
        </a>

    </div>

</section>

</body>
  </html>
